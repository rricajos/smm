name: Bug Report
description: Report a bug in Smart Mail Manager
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the sections below to help us investigate.
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Find it in Thunderbird > Add-ons > Smart Mail Manager
      placeholder: "1.5.103"
    validations:
      required: true
  - type: input
    id: thunderbird-version
    attributes:
      label: Thunderbird version
      description: Find it in Help > About Thunderbird
      placeholder: "128.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Classification rules
        - Response templates
        - AI assistant
        - Dashboard / Activity log
        - Import / Export
        - Options / Settings
        - Popup
        - Build / Development
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Error messages, console logs, AI provider used, OS, etc.
    validations:
      required: false
